[workspace]
resolver = "3"
members = [
    "packages/core",
    "packages/sources/claude",
    "packages/sources/codebuddy",
    "packages/sources/codebuddy-ide",
    "packages/sources/zed",
    "packages/sources/opencode",
    "packages/apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
aa_session_core = { path = "packages/core" }
aa_session_source_opencode = { path = "packages/sources/opencode" }
aa_session_source_claude = { path = "packages/sources/claude" }
aa_session_source_codebuddy = { path = "packages/sources/codebuddy" }
aa_session_source_codebuddy_ide = { path = "packages/sources/codebuddy-ide" }
aa_session_source_zed = { path = "packages/sources/zed" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
